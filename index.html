<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, 
    maximum-scale=1., user-scalable=no"
    <title>Realidade Aumentada</title>
    <script type="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
    <style>
        body{
            margin:0; height:100dvh; overflow: hidden; 
            background: #111; color: #eee; font-family: sans-serif;
        }

        model-viewer{width: 100%; height: 100%;}

        button{background: #333; color: #eee; border: 0; 
            border-radius: 6px; padding: 8px 14px; font-size: 14px;
        }  

        .botao-ar, .aviso-ar {position: absolute; bottom: 24px; left: 50%; 
            transform: translateX(-50%);
        }

        .aviso-ar{width: 90%; text-align: center; font-size: 14px;}

        .status{position: absolute; inset: 0; display: grid; place-items: center;
            background: #111; z-index: 1; pointer-events: none;
        }

        .status.hidden{display: none;}
        .status.error{color: #f88;}
    </style>
</head>
<body>
    <model-viewer
        id="viewer"
        src="modelo.glb"
        alt="Modelo 3D"
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-placement="floor"
        ar-scale="auto"
        xr-enviroment
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1">
        <button slot="ar-button" class="botao-ar">Ver em RA</button>
        <div id="aviso-ar" class="aviso-ar" hidden></div>
        <div id="status" class="status">Carregando modelo...</div>
    </model-viewer>

    <script>
        const viewer = document.getElementById('viewer');
        const status = document.getElementById('status');
        const avisoAr = document.getElementById('aviso-ar')
        function mostrarErro(mensagem){
            status.classList.remove('hidden');
            status.classList.add('error');
            status.textContent=mensagem;
        }

        function verificarDisponivelAR(){
            if(viewer.canActivadeAR){
                avisoAR.hidden = true;
                return;
            }
        const ehCelular = /Android|iPhone|iPod/i.test(navigator.userAgent) || 
        (navigator.plataform === 'MacIntel' && navigator.maxTouchPoints > 1);    
        }
        if(!window.isSecureContext && ehCelular){
            avisoAR.textContent='A Realidade Aumentada exige HTTPS. Abra este site por um endereço https://';
        }else if(!ehCelular){
            avisoAr.textContent = 'Para ver em Realidade Aumentada, abra este endereço no celular (Android ou iPhone)';
        }else{
            avisoAr.textContent = 'Este navegador não oferece Realidade Aumentada. Use Chrome (Android) ou Safari (iPhone)';
        }
        avisoAr.hidden = false;
        viewer.addEventListener('load', () =>{
            status.classList.add('hidden');
            verificarDisponivelAR();
        });
        viewer.addEventListener('error', (erro) => {
            mostrarErro('Não foi possivel carregar o modelo. Verifique se o arquivo modelo.glb está na mesma pasta do index.html.');
            console.error('Error ao carregar o modelo', viewer, src, evento.detail);
        });
        viewer.addEventListener('ar-status', (event) => {
            if(evento.detail.status === 'failed'){
                mastarErro('Não foi possível iniciar a Realidade Aumentada neste dispositivo ou navegador');
            }
        });
        setTimeout(() =>{
            if(!customElements.get('model-viewer')){
                mostrarErro('Não foi possível carregar a biblioteca. Verifique a conexão com a internet.')
            }
        }, 10000);
    </script>
</body>
</html>
